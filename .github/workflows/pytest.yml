name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  all-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest

  # the lockfile resolves pandas 3, so check pandas 2 separately: the oldest supported
  # release, and the latest 2.x on a newer Python (2.2.2 has no wheels past 3.12)
  pandas-2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pandas: "pandas[plot]==2.2.2"
          - python-version: "3.14"
            pandas: "pandas[plot]>=2.2.2,<3"
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check Python and pandas versions
        run: uv run --with "${{ matrix.pandas }}" python -c "import sys, pandas; v = '%d.%d' % sys.version_info[:2]; print(v, pandas.__version__); assert v == '${{ matrix.python-version }}', v; assert pandas.__version__.startswith('2.'), pandas.__version__"

      - name: Run pytest with pandas 2
        run: uv run --with "${{ matrix.pandas }}" pytest
